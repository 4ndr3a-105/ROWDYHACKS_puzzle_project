<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import Photo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="upload-container">
        <img src="./images/transparent_piece.png" class="puzzle-piece upload-piece-bottom-left" alt="">
        
        <img src="./images/transparent_piece.png" class="puzzle-piece upload-piece-bottom-right" alt="">
        
        <div class="upload-card">
            <label for="file-input" class="upload-dropzone">
                <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
                    <polyline points="16 16 12 12 8 16"></polyline>
                    <polyline points="9 14 12 11 15 14"></polyline>
                </svg>
            </label> 
            <input type="file" id="file-input" accept="image/*" style="display: none;" />
        </div>
        <div class="controls-panel upload-controls">
      
            <div class="difficulty-header upload-title">
                <span>Choose your difficulty</span>
            </div>
            <div class="difficulty-options">
                <button class="btn difficulty-btn" data-grid="3">Easy</button>
                <button class="btn difficulty-btn" data-grid="4">Medium</button>
                <button class="btn difficulty-btn" data-grid="5">hard</button>
                <a href="index.html" class="btn difficulty-btn">Back to menu</a>
            </div>
        </div>

    </div>
    <script src="script.js"></script>

</body>
</html>
