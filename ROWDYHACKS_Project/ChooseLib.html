<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose From Library</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="library-container"> 

        <div class="photo-card-frame"> 
            <img src="./images/transparent_piece.png" class="puzzle-piece lib-piece-top-left" alt="">
            <!--
            <img src="./images/transparent_piece.png" class="puzzle-piece lib-piece-bottom-right" alt="">
        -->
        

            <div class="photo-grid"> 
                <div class="photo-item">
                    <img src="./images/IMG_0529.PNG" alt="cat" width="200px" height="100">
                </div>
                <div class="photo-item">
                    <img src="./images/IMG_2265.PNG" alt="peace sign" width="200px" height="100px">
                </div> 
                <div class="photo-item">
                    <img src="./images/IMG_2505.PNG" alt="look at camera" width="200px" height="100px">
                </div>
                <div class="photo-item">
                    <img src="./images/IMG_9735.PNG" alt="horse at beach" width="200px" height="100px">
                </div>
                <div class="photo-item">
                    <img src="./images/IMG_4154.png" alt="beach view" width="200px" height="100px">
                </div>
                <div class="photo-item">
                    <img src="./images/IMG_4325.jpeg" alt="the devs!" width="200px" height="100px">
                </div>
            </div>
        </div>
        
        <div class="controls-panel">
            <!--
            <img src="./images/transparent_piece.png" class="puzzle-piece lib-piece-title-right" alt="">
        -->
            <div class="page-title-card">
                <h2>Choose from Library</h2>
            </div>

            <div class="difficulty-header">
                <span>Choose your difficulty</span>
            </div>

            <div class="difficulty-options">
                <button class="btn difficulty-btn" data-grid="3">Easy (3x3)</button>
                <button class="btn difficulty-btn" data-grid="4">Medium (4x4)</button>
                <button class="btn difficulty-btn" data-grid="5">Hard (5x5)</button>
            </div>  

        <a href="index.html" class="btn difficulty-btn">Back</a>

        <!--<a href="index.html" class="btn difficulty-btn" style="margin-top: 12px; text-decoration: none;">Back</a> -->
      
        </div>

    </div>
    <script src="script.js"></script>

</body>
</html>
